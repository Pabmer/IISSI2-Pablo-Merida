<!DOCTYPE html>
<html>

<head>
    <title>Album form</title>

    <link rel="icon" href="/images/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/font-awesome.min.css">
    <script src="/js/libs/bootstrap.min.js"></script>
    <script src="/js/libs/axios.min.js"></script>
    <script src="/js/utils/include.js"></script>

    <script src="/js/newAlbum.js" type="module"></script>
    <script src="/js/header.js" type="module"></script>

</head>

<body>
    <div id="page-header"></div>

    <h2 id="page-title">Upload a new album:</h2>

    <hr>

    <div id="errors"></div>

    <div class="container">
        <form id="form-album-upload">
            <div class="form-group">
                <label for="input-url">URL:</label>
                <input required type="text" class="form-control" id="input-url" name="imageUrl" placeholder="Photo URL">
            </div>
            <div class="form-group">
                <label for="input-title">Title:</label>
                <input required type="text" class="form-control" id="input-title" name="title" placeholder="Title">
            </div>
            <div class="form-group">
                <label for="input-title">Artist:</label>
                <input required type="text" class="form-control" id="input-artist" name="artist" placeholder="Artist">
            </div>
            <div class="form-group">
                <label for="input-title">Release Date:</label>
                <input required type="date" class="form-control" id="input-date" name="releaseDate" placeholder="dd/mm/aaaa">
            </div>
            <div class="form-group">
                <label for="input-title">Number of Tracks:</label>
                <input required type="number" class="form-control" id="input-tracks" name="numTracks" placeholder="Number of Tracks">
            </div>
    </div>

    <hr>

    <div class="row">
        <div class="col-md text-center">
            <button type="submit" class="btn btn-primary">Send</button>
        </div>
    </div>
    </form>
    </div>

</body>

</html>

<script>
    include("header.html", "#page-header");
</script>
